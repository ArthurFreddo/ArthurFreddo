name: Update profile images

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-snake.yaml
      - .github/scripts/render-profile-stats.py

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  update-cards:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate public GitHub stats
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 .github/scripts/render-profile-stats.py "$PROFILE_USERNAME" generated/stats.svg

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&theme=radical&disable_animations=true
          path: generated/streak.svg

      - name: Validate and publish cards
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          expected_labels = {
              "generated/stats.svg": ("Public Repositories", "Stars Earned", "Followers"),
              "generated/streak.svg": ("Total Contributions", "Current Streak", "Longest Streak"),
          }
          for path, labels in expected_labels.items():
              root = ET.parse(path).getroot()
              content = " ".join(root.itertext())
              if root.tag != "{http://www.w3.org/2000/svg}svg" or any(label not in content for label in labels):
                  raise SystemExit(f"{path}: expected an SVG with all card statistics")
          PY
          mv generated/stats.svg generated/streak.svg profile/
          git add profile/stats.svg profile/streak.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh GitHub profile cards'
          git push origin HEAD:refs/heads/main

  generate-snake:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out the animation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: output

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: generated/snake.svg?palette=github-dark

      - name: Validate and publish snake.svg
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("generated/snake.svg").getroot()
          namespace = "{http://www.w3.org/2000/svg}"
          styles = " ".join(style.text or "" for style in root.iter(namespace + "style"))
          if root.tag != namespace + "svg" or "@keyframes" not in styles:
              raise SystemExit("snake.svg: expected a valid animated SVG")
          PY
          mv generated/snake.svg snake.svg
          git add snake.svg
          if git diff --cached --quiet; then
            echo "The snake animation is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution snake'
          git push origin HEAD:refs/heads/output
